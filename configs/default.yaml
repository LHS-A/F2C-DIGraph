project_name: F2C-DIGraph_Reproduction
seed: 42
strict_reproduction: true
deterministic: true
mixed_precision: true
multi_gpu: true

paths:
  csv: data/metadata.csv
  split_csv: outputs/folds/patient_level_5fold_split.csv
  output_dir: outputs
  checkpoints: outputs/checkpoints
  logs: outputs/logs
  results: outputs/results
  retinabert_ckpt: outputs/checkpoints/retinabert.pth
  umls_concepts: outputs/knowledge/umls_retina_concepts.csv
  scg_nodes: SGC_nodes.txt
  mask_csv:

data:
  image_size: 1024
  n_folds: 5
  val_fraction: 0.15
  num_workers: 4
  classes: [AMD, CSC, DR, RVO, Normal]
  ffa_frames: 3
  mask_types: [RV, MA, NPA, NV, LEAKAGE]
  rho_cross: 0.1
  kappa: 8
  min_valid_overlap: 0.9

model:
  backbone: resnet50
  pretrained: true
  embed_dim: 768
  semantic_nodes: 66
  semantic_layers: 2
  topology_layers: 2
  topology_bases: 5
  heads: 8
  dropout: 0.1

training:
  epochs: 100
  batch_size: 24
  lr: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  optimizer: AdamW
  scheduler: cosine
  lambda_sem_max: 0.4
  lambda_topo_max: 0.2
  distill_warmup_fraction: 0.3
  grad_clip_norm: 1.0

retinabert:
  pretrained_name: emilyalsentzer/Bio_ClinicalBERT
  epochs: 100
  batch_size: 64
  lr: 5.0e-5
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  weight_decay: 0.2
  warmup_steps: 10000
  tau: 0.07
